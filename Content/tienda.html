<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href ="../styles/tienda.css">
    <link rel="stylesheet" href ="../styles/header.css">
    <link rel="stylesheet" href ="../styles/footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../scripts/productos.js"></script>
    
    <title>Tienda</title>
</head>
<body>
    <awa-header></awa-header>
    <script src="../scripts/header.js"></script>
    <div class="filtros">
        <input type="checkbox" id="filtro" class="filtro">
        <label for="filtro" class="embudo">
            <i class="fa-solid fa-filter"></i>
            <i class="fa-solid fa-xmark"></i>
            <p>Filtros</p>
        </label>
        
        <div class="panel">
            <H2>Filtrar por: </H2>
            <h3>Categoría</h3>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Limpieza">
                <label class="form-check-label" for="Limpieza">
                    Limpieza
                </label>
            </div>
             <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Hidratacion">
                <label class="form-check-label" for="Hidratacion">
                    Hidratacion
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Luminosidad">
                <label class="form-check-label" for="Luminosidad">
                    Luminosidad
                </label>
            </div>
             <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Piel-Sensible">
                <label class="form-check-label" for="Piel-Sensible">
                    Piel Sensible
                </label>
            </div>
             <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Proteccion-Solar">
                <label class="form-check-label" for="Proteccion-Solar">
                Proteccion Solar
                </label>
            </div>
             <div class="form-check">
                <input class="form-check-input" type="checkbox" id="Cuidado-Nocturno">
                <label class="form-check-label" for="Cuidado-Nocturno">
                    Cuidado Nocturno
                </label>
            </div>
            <h3>Precio</h3>
            <div class="filtro-precio">
                <input 
                    type="range" 
                    class="form-range" 
                    id="precioMaximo"
                    min="0"
                    max="40"
                    value="40"
                    step="1">
                <div>
                    Max $<span id="valorPrecio">40.00</span>
                </div>
            </div>
            
        </div>
        
    </div>
    
    <div class="grid-productos" id="contenedor-productos"></div>
    
    <awa-footer></awa-footer>
    <script src="../scripts/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
