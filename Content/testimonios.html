<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../scripts/testimonios.js"></script>
    <link rel="stylesheet" href ="../styles/header.css">
    <link rel="stylesheet" href ="../styles/footer.css">
    <link rel="stylesheet" href="../styles/testimonios.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <title>Document</title>
</head>
<body>
    <awa-header></awa-header>
    <script src="../scripts/header.js"></script>
    <div class="titulo">
        <span class="mensaje">♥ Lo que dicen de nosotros ♥</span>
        <h1>Testimonios</h1>
        <p>Personas que como tú, están apostando por el poder del skincare coreano.</p>
        
    </div>
    <div id="carousel-testimonios" class="carousel slide" data-bs-ride="false">
        <div class="carousel-inner" id="contenedor-testimonios">
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carousel-testimonios" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel-testimonios" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>
    <awa-footer></awa-footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/footer.js"></script>
</body>
</html>
